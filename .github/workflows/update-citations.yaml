# Refresh the list of publications citing codyn from OpenAlex and commit it to
# main when it changes. The DOIs searched are configured in
# pkgdown/citations/citation-sources.yml.
#
# The commit is pushed with a token from the NCEAS GitHub App, which is allowed
# to bypass main's branch protection. Pushes made with the default
# GITHUB_TOKEN would be blocked and would not trigger the pkgdown workflow;
# pushes made with the app's token do both, so the site is rebuilt.
#
# Requires:
#   vars.NCEAS_BOT_CLIENT_ID       the app's Client ID (organization variable)
#   secrets.NCEAS_BOT_PRIVATE_KEY  the app's private key (organization secret)
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

name: update-citations.yaml

permissions: read-all

jobs:
  update-citations:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Get NCEAS bot token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.NCEAS_BOT_CLIENT_ID }}
          private-key: ${{ secrets.NCEAS_BOT_PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@v6
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::yaml, any::jsonlite

      - name: Update citations
        env:
          CITATION_SUMMARY: ${{ runner.temp }}/citation-summary.txt
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: Rscript pkgdown/citations/update_citations.R

      - name: Commit and push changes
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          SUMMARY: ${{ runner.temp }}/citation-summary.txt
        run: |
          bib=vignettes/articles/citing-pubs.bib
          if git diff --quiet -- "$bib"; then
            echo "No changes to the list of publications."
            exit 0
          fi
          user_id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git add "$bib"
          { echo "Update list of publications citing codyn"; echo; cat "$SUMMARY"; } > "$RUNNER_TEMP/message.txt"
          git commit --cleanup=verbatim -F "$RUNNER_TEMP/message.txt"
          git pull --rebase origin main
          git push origin HEAD:main
