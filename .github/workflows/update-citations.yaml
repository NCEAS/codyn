# Refresh the list of publications citing codyn from OpenAlex and open a pull
# request when it changes. The DOIs searched are configured in
# pkgdown/citations/citation-sources.yml.
on:
  schedule:
    - cron: "0 6 1 * *"
  workflow_dispatch:

name: update-citations.yaml

permissions: read-all

jobs:
  update-citations:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::yaml, any::jsonlite

      - name: Update citations
        env:
          CITATION_SUMMARY: ${{ runner.temp }}/citation-summary.md
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: |
          echo "Automated update found no changes." > "$CITATION_SUMMARY"
          Rscript pkgdown/citations/update_citations.R

      - name: Open pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/update-citations
          delete-branch: true
          commit-message: Update list of publications citing codyn
          title: Update list of publications citing codyn
          body-path: ${{ runner.temp }}/citation-summary.md
          add-paths: vignettes/articles/citing-pubs.bib
